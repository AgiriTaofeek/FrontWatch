services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: frontwatch
      POSTGRES_PASSWORD: frontwatch_dev
      POSTGRES_DB: frontwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # Without these, the official image explicitly disables network
      # access for the 'default' user entirely — confirmed directly
      # from its own startup log: "neither CLICKHOUSE_USER nor
      # CLICKHOUSE_PASSWORD is set, disabling network access for user
      # 'default'". Only in-container (unix socket) connections worked
      # before this; nothing external — not even the host — could ever
      # authenticate. The /ping healthcheck never caught it because
      # that endpoint doesn't require authentication.
      CLICKHOUSE_USER: frontwatch
      CLICKHOUSE_PASSWORD: frontwatch_dev
      CLICKHOUSE_DB: frontwatch
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native protocol (faster, most client libraries use this)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      # Dual listeners: "internal" for other containers on this Docker
      # network (advertised as the service name, resolvable only inside
      # the network), "external" for the host machine (advertised as
      # localhost, on a different port — Redpanda requires distinct
      # ports per listener). Without "external", any client running on
      # the host (e.g. `go run`, `go test`) can complete the initial
      # bootstrap connection against localhost:9092, but then hangs
      # trying to reach the *advertised* address for the actual
      # produce/consume — "redpanda:9092" doesn't resolve outside the
      # Docker network. Confirmed by hitting exactly that hang while
      # building the Go ingestion service's Redpanda publisher.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644" # admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
