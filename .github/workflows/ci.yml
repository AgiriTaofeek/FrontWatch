name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript / Bun
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frontwatch
          POSTGRES_PASSWORD: frontwatch_dev
          POSTGRES_DB: frontwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://frontwatch:frontwatch_dev@localhost:5432/frontwatch
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome (lint + format check)
        run: bunx --bun @biomejs/biome ci .
      - name: Run DB migrations
        working-directory: apps/control-api
        run: bunx drizzle-kit migrate
      - name: Run tests
        run: bun test

  go:
    name: Go data-plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/data-plane/go.mod
      - name: Build
        run: go build ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: services/data-plane
