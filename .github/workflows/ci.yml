name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript / Bun
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frontwatch
          POSTGRES_PASSWORD: frontwatch_dev
          POSTGRES_DB: frontwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # control-api's issue queries (Step 6) read ClickHouse directly —
      # this job's Postgres/ClickHouse are isolated from the Go job's
      # (separate runners, no shared state), so both need migrating
      # independently even though the schema is identical.
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: frontwatch
          CLICKHOUSE_PASSWORD: frontwatch_dev
          CLICKHOUSE_DB: frontwatch
        ports:
          - 8123:8123
          # golang-migrate's ClickHouse driver connects via the native
          # protocol (9000), not HTTP — control-api's own runtime
          # queries use 8123, but the migration step below needs this
          # too. Both need exposing.
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://frontwatch:frontwatch_dev@localhost:5432/frontwatch
      CLICKHOUSE_HTTP_ADDR: localhost:8123
      CLICKHOUSE_USERNAME: frontwatch
      CLICKHOUSE_PASSWORD: frontwatch_dev
      CLICKHOUSE_DATABASE: frontwatch
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome (lint + format check)
        run: bunx --bun @biomejs/biome ci .
      # `bun test` never type-checks — it only strips types and runs.
      # Nothing here caught that until @types/bun was actually resolvable
      # for every package (a real, previously-invisible gap: packages/sdk
      # and packages/contracts had no @types/bun at all, only
      # control-api did, individually — fixed by hoisting it to the root
      # devDependencies once instead of per-package). Running it here
      # once per package, the same way tests are already scoped, is what
      # actually caught two real type errors in packages/sdk (an
      # untyped mock making `.mock.calls` infer as `[][]`, and a
      # `window.fetch` reassignment that stopped structurally matching
      # `typeof fetch` once @types/bun's Bun-specific `fetch.preconnect`
      # augmentation became visible).
      - name: Typecheck (contracts)
        working-directory: packages/contracts
        run: bunx tsc --noEmit
      - name: Typecheck (sdk)
        working-directory: packages/sdk
        run: bunx tsc --noEmit
      - name: Typecheck (react)
        working-directory: packages/react
        run: bunx tsc --noEmit
      - name: Typecheck (control-api)
        working-directory: apps/control-api
        run: bunx tsc --noEmit
      # apps/web's routeTree.gen.ts is gitignored — TanStack Start's Vite
      # plugin generates it from src/routes/ on every dev/build run, so a
      # fresh CI checkout never has it. Confirmed the hard way: this
      # Typecheck step failed here first (Cannot find module
      # './routeTree.gen') even though `bunx tsc --noEmit` had just
      # passed locally — locally there was a leftover generated file
      # from an earlier manual `vite build`, which a clean CI checkout
      # never has. `vite build` (not `dev`, which never exits) generates
      # the same file and terminates on its own.
      - name: Generate route tree
        working-directory: apps/web
        run: bunx vite build
      - name: Typecheck (web)
        working-directory: apps/web
        run: bunx tsc --noEmit
      - name: Run Postgres migrations
        working-directory: apps/control-api
        run: bunx drizzle-kit migrate
      # golang-migrate is the one tool this project uses for ClickHouse
      # schema (services/data-plane/migrations/clickhouse) — reused
      # here rather than duplicated, even though this is otherwise the
      # TS job, since the schema itself is the Go side's to own.
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/data-plane/go.mod
      - name: Run ClickHouse migrations
        run: |
          go install -tags 'clickhouse' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          migrate -database "clickhouse://localhost:9000?username=frontwatch&password=frontwatch_dev&database=frontwatch&x-multi-statement=true" \
            -path services/data-plane/migrations/clickhouse up
      # --timeout above bun:test's 5000ms default: a real, reproducible
      # flake (a different ClickHouse-backed test times out each run) was
      # traced to this job's constrained CPU plus a shared, module-level
      # ClickHouse client's connection pool — see db/clickhouse.ts's own
      # comment for the primary fix (raising max_open_connections). This
      # is the second, defense-in-depth half: real production p95 query
      # latency is 23-77ms (Step 9's load testing), so a generous CI-only
      # ceiling costs nothing and doesn't mask a genuine hang the way an
      # unbounded timeout would.
      - name: Run control-api tests
        working-directory: apps/control-api
        run: bun test --timeout=20000
      - name: Run sdk tests
        # Scoped deliberately — a single root-level `bun test` does not
        # reliably apply a nested package's bunfig.toml (confirmed
        # locally: happy-dom's window never registers when run from
        # root). Each package's tests run from inside that package.
        working-directory: packages/sdk
        run: bun test
      - name: Run react tests
        working-directory: packages/react
        run: bun test
      - name: Run web tests
        working-directory: apps/web
        run: bun test

  go:
    name: Go data-plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frontwatch
          POSTGRES_PASSWORD: frontwatch_dev
          POSTGRES_DB: frontwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # Unlike Redpanda, no custom startup command needed here — the
      # official image handles auth purely through env vars in its own
      # entrypoint, so services: works fine (confirmed locally: without
      # these, the image explicitly disables network access for the
      # 'default' user entirely — see infra/local/docker-compose.yml's
      # comment for the full story).
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: frontwatch
          CLICKHOUSE_PASSWORD: frontwatch_dev
          CLICKHOUSE_DB: frontwatch
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://frontwatch:frontwatch_dev@localhost:5432/frontwatch
      REDPANDA_BROKERS: localhost:9092
      CLICKHOUSE_ADDR: localhost:9000
      CLICKHOUSE_DATABASE: frontwatch
      CLICKHOUSE_USERNAME: frontwatch
      CLICKHOUSE_PASSWORD: frontwatch_dev
    defaults:
      run:
        working-directory: services/data-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/data-plane/go.mod
      - name: Build
        run: go build ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: services/data-plane
      # Go's Postgres integration tests (internal/storage/postgres) need
      # the real schema Bun/Drizzle owns and migrates - not a schema Go
      # controls itself (ADR-022: Go only ever reads this table). Bun
      # is set up here purely to run that one migration step.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install control-api dependencies
        working-directory: apps/control-api
        run: bun install --frozen-lockfile
      - name: Run DB migrations
        working-directory: apps/control-api
        run: bunx drizzle-kit migrate
      # GitHub Actions' `services:` block can't override a container's
      # startup command, which Redpanda needs — tried the official
      # redpanda-data/github-action first, but it's broken: its
      # entrypoint is hardcoded to the `vectorized/redpanda` image,
      # which no longer exists under that name on Docker Hub (Redpanda
      # renamed to `redpandadata/redpanda` — the name our own
      # infra/local/docker-compose.yml already correctly uses). No
      # version input fixes this since the base image name itself is
      # wrong. Running the same known-working image directly instead.
      # Single listener is enough here (unlike local docker-compose) —
      # nothing else needs to reach it except this job's own steps.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 -p 9644:9644 \
            redpandadata/redpanda:v24.2.7 \
            redpanda start --mode=dev-container --smp=1 --memory=1G --overprovisioned --node-id=0 \
            --kafka-addr=internal://0.0.0.0:9092 \
            --advertise-kafka-addr=internal://localhost:9092
      - name: Wait for Redpanda
        run: |
          for i in $(seq 1 30); do
            if docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true'; then
              echo "Redpanda healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Redpanda did not become healthy in time" >&2
          docker logs redpanda
          exit 1
      - name: Run ClickHouse migrations
        run: |
          go install -tags 'clickhouse' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          migrate -database "clickhouse://localhost:9000?username=frontwatch&password=frontwatch_dev&database=frontwatch&x-multi-statement=true" \
            -path migrations/clickhouse up
      - name: Test
        run: go test ./...
